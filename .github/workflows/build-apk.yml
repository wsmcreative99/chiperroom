name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL server Render, mis. https://chiperroom-abc.onrender.com'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare www folder with server URL
        run: |
          mkdir -p www
          cp public/index.html www/index.html
          sed -i 's|socket = io({ transports|socket = io(window.CIPHERROOM_SERVER_URL || undefined, { transports|' www/index.html
          sed -i 's|<script src="/socket.io/socket.io.js"></script>|<script>window.CIPHERROOM_SERVER_URL = "'"${{ inputs.server_url }}"'";</script>\n<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>|' www/index.html
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Init Capacitor
        run: npx cap init ChiperRoom com.layka.chiperroom --web-dir www
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chiperroom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
