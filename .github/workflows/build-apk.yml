name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare www folder
        run: mkdir -p www && cp public/index.html www/index.html
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Init Capacitor
        run: npx cap init ChiperRoom com.layka.chiperroom --web-dir www
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chiperroom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
